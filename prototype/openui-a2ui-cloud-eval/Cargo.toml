[package]
name = "openui-a2ui-cloud-eval"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "eval-app"

[lib]
path = "src/lib.rs"

[[bin]]
name = "normalize-openui"
path = "src/bin/normalize-openui.rs"

[[bin]]
name = "normalize-a2ui"
path = "src/bin/normalize-a2ui.rs"

[[bin]]
name = "eval-app"
path = "src/bin/eval-app.rs"
required-features = ["ui"]

[[bin]]
name = "render-once"
path = "src/bin/render-once.rs"
required-features = ["ssr"]

[[bin]]
name = "runtime-probe"
path = "src/bin/runtime-probe.rs"

[[bin]]
name = "validate-records"
path = "src/bin/validate-records.rs"

[features]
default = []
ui = ["dep:dioxus"]
desktop = ["ui", "dioxus/desktop"]
web = ["ui", "dioxus/web", "dep:web-sys"]
mobile = ["ui", "dioxus/mobile"]
ssr = ["ui", "dep:dioxus-ssr"]

[dependencies]
anyhow = "1.0"
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["minimal", "document"] }
dioxus-ssr = { version = "=0.7.10", optional = true }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
web-sys = { version = "0.3", optional = true, features = ["Window", "Location"] }

[dev-dependencies]
tempfile = "3.23"
