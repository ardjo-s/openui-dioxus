[package]
name = "openui-dioxus-real-mcp-prototype"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "openui-dioxus-real-mcp-prototype"

[lib]
path = "src/lib.rs"

[[bin]]
name = "prototype-evidence"
path = "src/bin/prototype-evidence.rs"

[features]
default = []
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["minimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
