<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPE-11 json-render canary</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #142033; background: #eef3f8; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(760px, calc(100% - 32px)); margin: 24px auto; padding: 24px; background: white; border: 1px solid #cbd5e1; border-radius: 16px; }
      [role="toolbar"] { display: grid; gap: 16px; align-items: start; }
      label { display: grid; gap: 6px; font-weight: 650; }
      input, select, button { min-height: 44px; font: inherit; }
      button { padding: 10px 14px; color: white; background: #164e9a; border: 0; border-radius: 8px; }
      button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
      [role="status"] { padding: 12px; border-left: 4px solid #167044; background: #eaf8f0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
