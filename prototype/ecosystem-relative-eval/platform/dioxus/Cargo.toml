[package]
name = "ope11-dioxus-canary"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
app = ["dioxus-components-catalog-eval/ui"]
ssr = ["app", "dioxus-components-catalog-eval/ssr", "dep:dioxus-ssr"]
desktop = ["app", "dioxus/desktop", "dioxus-components-catalog-eval/desktop"]
web = ["app", "dioxus/web", "dioxus-components-catalog-eval/web"]

[dependencies]
anyhow = "1.0"
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "document"] }
dioxus-components-catalog-eval = { path = "../../../dioxus-components-catalog-eval", default-features = false }
dioxus-ssr = { version = "=0.7.10", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ope11-dioxus-canary"
path = "src/main.rs"
required-features = ["app"]
