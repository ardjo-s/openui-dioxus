[package]
name = "dioxus-components-catalog-eval"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
ui = ["dep:dioxus", "dep:dioxus-primitives"]
ssr = ["ui", "dep:dioxus-ssr"]

[dependencies]
anyhow = "1.0"
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["minimal", "document"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/dioxus-components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", optional = true, default-features = false }
dioxus-ssr = { version = "=0.7.10", optional = true }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
