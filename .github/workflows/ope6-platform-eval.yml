name: OPE-6 platform evaluation

on:
  push:
    branches: [codex/ope-6-platform-accessibility]
    paths:
      - ".github/workflows/ope6-platform-eval.yml"
      - "prototype/dioxus-components-catalog-eval/**"
      - "prototype/openui-typed-json-product-eval/**"
      - "!prototype/openui-typed-json-product-eval/platform/evidence/published/**"

permissions:
  contents: read

concurrency:
  group: ope6-platform-eval
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"

jobs:
  web-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototype/dioxus-components-catalog-eval/generator/package-lock.json
            prototype/openui-typed-json-product-eval/package-lock.json
      - name: Install Linux WebView and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb imagemagick jq
      - name: Install Dioxus CLI
        run: prototype/openui-typed-json-product-eval/platform/install-dioxus-cli.sh
      - name: Install Node dependencies and Chromium
        run: |
          npm ci --prefix prototype/dioxus-components-catalog-eval/generator --ignore-scripts
          npm ci --prefix prototype/openui-typed-json-product-eval --ignore-scripts
          npx --prefix prototype/openui-typed-json-product-eval playwright install --with-deps chromium
      - name: Verify platform fixtures and Rust probe
        run: |
          npm run --prefix prototype/openui-typed-json-product-eval platform:generate
          git diff --exit-code -- prototype/openui-typed-json-product-eval/platform/fixtures
          cargo test --manifest-path prototype/dioxus-components-catalog-eval/Cargo.toml --features ui platform::tests
      - name: Run Chromium evaluation
        id: web
        continue-on-error: true
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/web-desktop
        run: prototype/openui-typed-json-product-eval/platform/run-web.sh
      - name: Run Dioxus Desktop evaluation
        id: desktop
        continue-on-error: true
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/web-desktop
        run: prototype/openui-typed-json-product-eval/platform/run-desktop.sh
      - name: Upload Web and Desktop evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-web-desktop
          path: prototype/openui-typed-json-product-eval/platform/evidence/web-desktop
          if-no-files-found: warn

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install Dioxus CLI
        run: prototype/openui-typed-json-product-eval/platform/install-dioxus-cli.sh
      - name: Run iOS Simulator evaluation
        continue-on-error: true
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/ios
        run: prototype/openui-typed-json-product-eval/platform/run-ios.sh
      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-ios
          path: prototype/openui-typed-json-product-eval/platform/evidence/ios
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Dioxus CLI
        run: prototype/openui-typed-json-product-eval/platform/install-dioxus-cli.sh
      - name: Configure Android NDK
        run: |
          ndk_home=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk_home"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - name: Run Android Emulator evaluation
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: prototype/openui-typed-json-product-eval/platform/run-android.sh
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/android
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-android
          path: prototype/openui-typed-json-product-eval/platform/evidence/android
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: [web-desktop, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ope6-*
          merge-multiple: true
          path: prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud
      - name: Aggregate and hash evidence
        run: node prototype/openui-typed-json-product-eval/platform/aggregate-evidence.mjs prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-platform-aggregate
          path: prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud
      - name: Enforce complete four-platform evidence
        run: jq -e '.evidence_status == "PASS"' prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud/summary.json
