name: OPE-6 platform evaluation

on:
  push:
    branches: [codex/ope-6-platform-accessibility, codex/ope-8-ci-speed]
    paths:
      - ".github/workflows/ope6-platform-eval.yml"
      - "prototype/dioxus-components-catalog-eval/**"
      - "prototype/openui-typed-json-product-eval/**"
      - "!prototype/openui-typed-json-product-eval/platform/evidence/published/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "Run bounded quick checks or the complete certified matrix"
        required: true
        default: full
        type: choice
        options: [quick, full]

permissions:
  contents: read

concurrency:
  group: ope6-platform-eval-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"
  DIOXUS_VERSION: 0.7.10
  CATALOG_TARGET: prototype/dioxus-components-catalog-eval/target

jobs:
  quick:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'quick'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CATALOG_TARGET }}
          key: ope6-quick-${{ runner.os }}-${{ runner.arch }}-wasm32-unknown-unknown-dioxus-${{ env.DIOXUS_VERSION }}-${{ hashFiles('prototype/dioxus-components-catalog-eval/Cargo.lock') }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototype/dioxus-components-catalog-eval/generator/package-lock.json
            prototype/openui-typed-json-product-eval/package-lock.json
      - name: Run bounded quick checks
        id: quick_checks
        continue-on-error: true
        run: |
          npm ci --prefix prototype/dioxus-components-catalog-eval/generator --ignore-scripts
          npm ci --prefix prototype/openui-typed-json-product-eval --ignore-scripts
          npm run --prefix prototype/openui-typed-json-product-eval platform:generate
          git diff --exit-code -- prototype/openui-typed-json-product-eval/platform/fixtures
          npm test --prefix prototype/openui-typed-json-product-eval
          cargo test --manifest-path prototype/dioxus-components-catalog-eval/Cargo.toml --features ui platform::tests
      - name: Write quick-only result
        if: always()
        run: |
          mkdir -p prototype/openui-typed-json-product-eval/platform/evidence/quick
          jq -n --arg outcome "${{ steps.quick_checks.outcome }}" \
            '{verification_scope:"quick-only", outcome:$outcome, certified_matrix:false}' \
            > prototype/openui-typed-json-product-eval/platform/evidence/quick/summary.json
      - name: Upload quick-only result
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-quick-checks
          path: prototype/openui-typed-json-product-eval/platform/evidence/quick
          if-no-files-found: error
      - name: Fail quick checks honestly
        if: always()
        run: test "${{ steps.quick_checks.outcome }}" = success

  web:
    if: github.event_name == 'push' || inputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4.2.4
        id: build_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CATALOG_TARGET }}
            ${{ runner.temp }}/dioxus-cli-0.7.10
          key: ope6-${{ runner.os }}-${{ runner.arch }}-wasm32-unknown-unknown-dioxus-${{ env.DIOXUS_VERSION }}-${{ hashFiles('prototype/dioxus-components-catalog-eval/Cargo.lock') }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototype/dioxus-components-catalog-eval/generator/package-lock.json
            prototype/openui-typed-json-product-eval/package-lock.json
      - name: Install Linux WebView and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick jq
      - name: Prepare Web evidence directory
        run: mkdir -p prototype/openui-typed-json-product-eval/platform/evidence/web/{screenshots,traces}
      - name: Install official Dioxus CLI
        run: prototype/openui-typed-json-product-eval/platform/install-dioxus-cli.sh
      - name: Install Node dependencies and Chromium
        run: |
          npm ci --prefix prototype/dioxus-components-catalog-eval/generator --ignore-scripts
          npm ci --prefix prototype/openui-typed-json-product-eval --ignore-scripts
          npx --prefix prototype/openui-typed-json-product-eval playwright install --with-deps chromium
      - name: Verify generated fixtures and Rust probe
        run: |
          npm run --prefix prototype/openui-typed-json-product-eval platform:generate
          git diff --exit-code -- prototype/openui-typed-json-product-eval/platform/fixtures
          cargo test --manifest-path prototype/dioxus-components-catalog-eval/Cargo.toml --features ui platform::tests
      - name: Run Chromium evaluation
        id: web_eval
        continue-on-error: true
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/web
        run: /usr/bin/time -p -o "$OPE6_EVIDENCE_DIR/traces/wall-time.txt" prototype/openui-typed-json-product-eval/platform/run-web.sh
      - name: Ensure Web failure evidence manifest
        if: always()
        run: |
          if [ ! -f prototype/openui-typed-json-product-eval/platform/evidence/web/web.json ]; then
            jq -n --arg error "Web evaluation step did not produce a result" \
              '{platform:"web",status:"INVALID_EVAL",passed:false,evidence_complete:false,error:$error}' \
              > prototype/openui-typed-json-product-eval/platform/evidence/web/web.json
          fi
      - name: Upload Web evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-platform-web
          path: prototype/openui-typed-json-product-eval/platform/evidence/web
          if-no-files-found: error
      - name: Fail Web job after evidence upload
        if: always()
        run: test "${{ steps.web_eval.outcome }}" = success

  desktop:
    if: github.event_name == 'push' || inputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4.2.4
        id: build_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CATALOG_TARGET }}
            ${{ runner.temp }}/dioxus-cli-0.7.10
          key: ope6-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-dioxus-${{ env.DIOXUS_VERSION }}-${{ hashFiles('prototype/dioxus-components-catalog-eval/Cargo.lock') }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototype/dioxus-components-catalog-eval/generator/package-lock.json
            prototype/openui-typed-json-product-eval/package-lock.json
      - name: Install Linux WebView and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick jq
      - name: Prepare Desktop evidence directory
        run: mkdir -p prototype/openui-typed-json-product-eval/platform/evidence/desktop/{screenshots,traces}
      - name: Install official Dioxus CLI
        run: prototype/openui-typed-json-product-eval/platform/install-dioxus-cli.sh
      - name: Verify generated fixtures and Rust probe
        run: |
          npm ci --prefix prototype/dioxus-components-catalog-eval/generator --ignore-scripts
          npm ci --prefix prototype/openui-typed-json-product-eval --ignore-scripts
          npm run --prefix prototype/openui-typed-json-product-eval platform:generate
          git diff --exit-code -- prototype/openui-typed-json-product-eval/platform/fixtures
          cargo test --manifest-path prototype/dioxus-components-catalog-eval/Cargo.toml --features ui platform::tests
      - name: Run Dioxus Desktop evaluation
        id: desktop_eval
        continue-on-error: true
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/desktop
        run: /usr/bin/time -p -o "$OPE6_EVIDENCE_DIR/traces/wall-time.txt" prototype/openui-typed-json-product-eval/platform/run-desktop.sh
      - name: Ensure Desktop failure evidence manifest
        if: always()
        run: |
          if [ ! -f prototype/openui-typed-json-product-eval/platform/evidence/desktop/desktop.json ]; then
            jq -n --arg error "Desktop evaluation step did not produce a result" \
              '{platform:"desktop",status:"INVALID_EVAL",passed:false,evidence_complete:false,error:$error}' \
              > prototype/openui-typed-json-product-eval/platform/evidence/desktop/desktop.json
          fi
      - name: Upload Desktop evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-platform-desktop
          path: prototype/openui-typed-json-product-eval/platform/evidence/desktop
          if-no-files-found: error
      - name: Fail Desktop job after evidence upload
        if: always()
        run: test "${{ steps.desktop_eval.outcome }}" = success

  ios:
    if: github.event_name == 'push' || inputs.profile == 'full'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4.2.4
        id: build_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CATALOG_TARGET }}
            ${{ runner.temp }}/dioxus-cli-0.7.10
          key: ope6-${{ runner.os }}-${{ runner.arch }}-aarch64-apple-ios-sim-dioxus-${{ env.DIOXUS_VERSION }}-${{ hashFiles('prototype/dioxus-components-catalog-eval/Cargo.lock') }}
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Prepare iOS evidence directory
        run: mkdir -p prototype/openui-typed-json-product-eval/platform/evidence/ios/{screenshots,traces}
      - name: Install official Dioxus CLI
        run: prototype/openui-typed-json-product-eval/platform/install-dioxus-cli.sh
      - name: Run iOS Simulator evaluation
        id: ios_eval
        continue-on-error: true
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/ios
        run: /usr/bin/time -p -o "$OPE6_EVIDENCE_DIR/traces/wall-time.txt" prototype/openui-typed-json-product-eval/platform/run-ios.sh
      - name: Ensure iOS failure evidence manifest
        if: always()
        run: |
          if [ ! -f prototype/openui-typed-json-product-eval/platform/evidence/ios/ios.json ]; then
            jq -n --arg error "iOS evaluation step did not produce a result" \
              '{platform:"ios",status:"INVALID_EVAL",passed:false,evidence_complete:false,error:$error}' \
              > prototype/openui-typed-json-product-eval/platform/evidence/ios/ios.json
          fi
      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-platform-ios
          path: prototype/openui-typed-json-product-eval/platform/evidence/ios
          if-no-files-found: error
      - name: Fail iOS job after evidence upload
        if: always()
        run: test "${{ steps.ios_eval.outcome }}" = success

  android:
    if: github.event_name == 'push' || inputs.profile == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4.2.4
        id: build_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CATALOG_TARGET }}
            ${{ runner.temp }}/dioxus-cli-0.7.10
          key: ope6-${{ runner.os }}-${{ runner.arch }}-x86_64-linux-android-dioxus-${{ env.DIOXUS_VERSION }}-${{ hashFiles('prototype/dioxus-components-catalog-eval/Cargo.lock') }}
      - name: Prepare Android evidence directory
        run: mkdir -p prototype/openui-typed-json-product-eval/platform/evidence/android/{screenshots,traces}
      - name: Install official Dioxus CLI
        run: prototype/openui-typed-json-product-eval/platform/install-dioxus-cli.sh
      - name: Configure Android NDK
        run: |
          ndk_home=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk_home"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - name: Build Android evaluation APK
        env:
          OPE6_ANDROID_BUILD_ONLY: "true"
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/android
        run: prototype/openui-typed-json-product-eval/platform/run-android.sh
      - name: Run Android Emulator evaluation
        id: android_eval
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: /usr/bin/time -p -o "$OPE6_EVIDENCE_DIR/traces/wall-time.txt" prototype/openui-typed-json-product-eval/platform/run-android.sh
        env:
          OPE6_EVIDENCE_DIR: ${{ github.workspace }}/prototype/openui-typed-json-product-eval/platform/evidence/android
      - name: Ensure Android failure evidence manifest
        if: always()
        run: |
          if [ ! -f prototype/openui-typed-json-product-eval/platform/evidence/android/android.json ]; then
            jq -n --arg error "Android evaluation step did not produce a result" \
              '{platform:"android",status:"INVALID_EVAL",passed:false,evidence_complete:false,error:$error}' \
              > prototype/openui-typed-json-product-eval/platform/evidence/android/android.json
          fi
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-platform-android
          path: prototype/openui-typed-json-product-eval/platform/evidence/android
          if-no-files-found: error
      - name: Fail Android job after evidence upload
        if: always()
        run: test "${{ steps.android_eval.outcome }}" = success

  aggregate:
    if: always() && (github.event_name == 'push' || inputs.profile == 'full')
    needs: [web, desktop, ios, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ope6-platform-*
          merge-multiple: true
          path: prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud
      - name: Aggregate and hash evidence
        run: node prototype/openui-typed-json-product-eval/platform/aggregate-evidence.mjs prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ope6-platform-aggregate
          path: prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud
          if-no-files-found: error
      - name: Enforce complete four-platform evidence
        run: jq -e '.evidence_status == "PASS"' prototype/openui-typed-json-product-eval/platform/evidence/platform-cloud/summary.json
